# Example included in Ubuntu's http context through sites-enabled.
# Merge with the existing Certbot-managed site; do not replace live TLS settings.
map $http_upgrade $multiplayer_game_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name multiplayer-game.vergotek.com;

    # Keep the existing ACME challenge method and Certbot renewal configuration.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/multiplayer-game;
    }
    location / {
        return 301 https://multiplayer-game.vergotek.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name multiplayer-game.vergotek.com;

    ssl_certificate /etc/letsencrypt/live/multiplayer-game.vergotek.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/multiplayer-game.vergotek.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/multiplayer-game/current/dist/client;
    index index.html;
    server_tokens off;
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        # The application checks the original Origin; never manufacture it here.
        proxy_set_header Origin $http_origin;
        proxy_set_header Connection "";
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_cache off;
        proxy_buffering off;
        access_log off;
    }

    location = /ws {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Origin $http_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $multiplayer_game_connection_upgrade;
        # Longer than the server's 15-second heartbeat interval.
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
        proxy_cache off;
        access_log off;
    }

    location /health/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_cache off;
        proxy_buffering off;
        access_log off;
    }

    # No SQLite, environment files, source checkout or uploaded staging directory
    # is exposed: only the client build is the public document root.
    location ~ /\. {
        deny all;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
